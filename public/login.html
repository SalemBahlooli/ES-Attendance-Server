<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Attendance System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand"><span class="brand-mark"></span>Attendance System</div>
    <p class="muted">Enter the password to access the attendance dashboard</p>
    <div id="err" class="alert" hidden>Incorrect password</div>
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit" class="btn primary">Log in</button>
  </form>
  <script>
    if (location.search.includes('error')) document.getElementById('err').hidden = false;
  </script>
</body>
</html>
