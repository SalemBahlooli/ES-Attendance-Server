<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول | نظام الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/login">
    <div class="brand"><span class="brand-mark"></span>نظام الحضور</div>
    <p class="muted">أدخل كلمة المرور للدخول إلى لوحة الحضور</p>
    <div id="err" class="alert" hidden>كلمة المرور غير صحيحة</div>
    <input type="password" name="password" placeholder="كلمة المرور" autofocus required>
    <button type="submit" class="btn primary">دخول</button>
  </form>
  <script>
    if (location.search.includes('error')) document.getElementById('err').hidden = false;
  </script>
</body>
</html>
