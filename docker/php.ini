; PHP settings for the app container. Change upload limits here.
upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 512M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Look for edited files at most every 2 seconds (development). The production
; image turns the check off: its code never changes (see the Dockerfile).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Remember resolved file paths: a big win when files sit on a slow folder share.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
