# Local development
#   app:   http://localhost:8090   (also the address the ZKTeco device sends punches to)
#   mail:  http://localhost:8026   (every email the app sends lands here)
#
#   docker compose up -d --build                   # start
#   docker compose exec app php artisan migrate    # any artisan command
#   docker compose exec app npm run dev            # Vite with hot reload
#   docker compose exec app php artisan test       # run the tests
#   docker compose down                            # stop (the database stays in the volume)
#
# The project folder is mounted into the container, so edits show up at once.
name: es-attendance

services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${APP_PORT:-8090}:80"
      - "${VITE_PORT:-5174}:5173"
    environment:
      APP_URL: http://localhost:${APP_PORT:-8090}   # links and uploaded images follow the port
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      RUN_SEEDERS: "true"
    volumes:
      - ./:/var/www/html
      # vendor/ and node_modules/ live in Docker volumes, not in the project folder:
      # reading thousands of files through the Windows/macOS folder share makes every
      # page take seconds. Run composer/npm inside the container (see README).
      - vendor:/var/www/html/vendor
      - node-modules:/var/www/html/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_FORWARD_PORT:-33061}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8026}:8025"

volumes:
  mysql-data:
  vendor:
  node-modules:
