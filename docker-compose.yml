# Run the attendance server on your own PC:
#   1. Copy .env.example to .env and set ADMIN_PASSWORD
#   2. docker compose up -d
#   3. Open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://attendance:attendance@db:5432/attendance
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-long-random-string}
      WORK_START: ${WORK_START:-08:00}
      DEVICE_TZ_OFFSET: ${DEVICE_TZ_OFFSET:-3}
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
