# Local run: docker compose up -d   then open http://localhost:8090
# Change the port on your machine with APP_PORT in .env (the device uses the same port)
# Fixed project name so the data volume stays the same whatever the folder is called
name: es-attendance
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://attendance:attendance@db:5432/attendance
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      PORT: 8080
    ports:
      - "${APP_PORT:-8090}:8080"

volumes:
  pgdata:
